<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 민속씨름 대회 일정</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap');

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root {
    --bg: #f6f7fb;
    --card: #ffffff;
    --text: #1a1a2e;
    --text-secondary: #6b7094;
    --accent: #3b5bdb;
    --accent-light: #edf2ff;
    --accent-dark: #2b4acb;
    --border: #e9ecf5;
    --shadow: 0 2px 16px rgba(59,91,219,0.06);
    --shadow-hover: 0 8px 32px rgba(59,91,219,0.12);
    --radius: 16px;
    --radius-sm: 10px;
    --cell-h: 80px;
    --day-num-h: 24px;
    --bar-h: 20px;
    --bar-gap: 2px;
  }

  html { scroll-behavior: smooth }

  body {
    font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  /* ── Hero ── */
  .hero {
    background: linear-gradient(135deg, #3b5bdb 0%, #5c7cfa 50%, #748ffc 100%);
    color: #fff;
    padding: 48px 20px 56px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    top: -60%; left: -30%;
    width: 160%; height: 200%;
    background: radial-gradient(ellipse at 30% 50%, rgba(255,255,255,0.08) 0%, transparent 60%);
    pointer-events: none;
  }
  .hero::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 40px;
    background: var(--bg);
    border-radius: 40px 40px 0 0;
  }
  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
    padding: 6px 16px;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.02em;
    margin-bottom: 16px;
  }
  .hero h1 {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
    line-height: 1.3;
  }
  .hero p {
    font-size: 15px;
    opacity: 0.85;
    font-weight: 300;
    max-width: 400px;
    margin: 0 auto;
  }

  /* ── Stats strip ── */
  .stats {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: -28px auto 0;
    padding: 0 20px;
    position: relative;
    z-index: 2;
    max-width: 480px;
  }
  .stat-chip {
    flex: 1;
    background: var(--card);
    border-radius: var(--radius-sm);
    padding: 14px 8px;
    text-align: center;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }
  .stat-chip .num {
    display: block;
    font-size: 22px;
    font-weight: 800;
    color: var(--accent);
    line-height: 1.2;
  }
  .stat-chip .label {
    font-size: 11px;
    color: var(--text-secondary);
    font-weight: 500;
    margin-top: 2px;
  }

  /* ── Month navigation bar ── */
  .month-nav-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 24px 20px 8px;
    max-width: 720px;
    margin: 0 auto;
    user-select: none;
  }
  .month-nav-btn {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--card);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow);
    transition: all 0.2s;
    color: var(--text);
    flex-shrink: 0;
  }
  .month-nav-btn:hover { background: var(--accent-light); color: var(--accent); }
  .month-nav-btn:active { transform: scale(0.94); }
  .month-nav-title {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.02em;
    min-width: 140px;
    text-align: center;
  }

  /* ── Quick month pills ── */
  .month-pills {
    display: flex;
    gap: 5px;
    padding: 8px 20px 4px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    max-width: 720px;
    margin: 0 auto;
    justify-content: center;
    flex-wrap: wrap;
  }
  .month-pills::-webkit-scrollbar { display: none }
  .month-pill {
    padding: 5px 12px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text-secondary);
    transition: all 0.2s;
    white-space: nowrap;
  }
  .month-pill:hover { background: var(--accent-light); color: var(--accent); }
  .month-pill.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .month-pill.has-event {
    color: var(--accent);
    border-color: rgba(59,91,219,0.25);
    background: var(--accent-light);
  }
  .month-pill.has-event.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  /* ── Calendar wrapper ── */
  .calendar-container {
    max-width: 720px;
    margin: 0 auto;
    padding: 12px 20px 20px;
  }

  /* ── Calendar grid ── */
  .calendar-grid {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    overflow: hidden;
    animation: fadeInUp 0.35s ease both;
  }
  .calendar-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    border-bottom: 1px solid var(--border);
  }
  .calendar-weekday {
    padding: 12px 4px;
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-secondary);
    letter-spacing: 0.04em;
  }
  .calendar-weekday.sun { color: #e53935; }
  .calendar-weekday.sat { color: #1e88e5; }

  /* ── Week row: relative container for spanning bars ── */
  .week-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    position: relative;
  }

  .calendar-day {
    height: var(--cell-h);
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    position: relative;
    transition: background 0.15s;
    overflow: hidden;
  }
  .calendar-day:nth-child(7) { border-right: none; }
  .calendar-day.empty { background: #fafbfe; }
  .calendar-day .day-number {
    display: block;
    font-size: 13px;
    font-weight: 600;
    padding: 4px 6px 0;
    line-height: 1.4;
    color: var(--text);
    height: var(--day-num-h);
  }
  .calendar-day.sun .day-number { color: #e53935; }
  .calendar-day.sat .day-number { color: #1e88e5; }
  .calendar-day.today .day-number span {
    background: var(--accent);
    color: #fff;
    border-radius: 6px;
    padding: 1px 6px;
  }
  .calendar-day.has-event { cursor: pointer; }
  .calendar-day.has-event:hover { background: rgba(59,91,219,0.03); }

  /* ── Spanning event bar (absolute over week row) ── */
  .event-span {
    position: absolute;
    height: var(--bar-h);
    border-radius: 4px;
    font-size: 10px;
    font-weight: 600;
    line-height: var(--bar-h);
    padding: 0 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
    transition: filter 0.15s;
    z-index: 2;
    pointer-events: auto;
  }
  .event-span:hover { filter: brightness(0.88); }
  .event-span.span-start { border-radius: 4px 0 0 4px; }
  .event-span.span-end { border-radius: 0 4px 4px 0; }
  .event-span.span-mid { border-radius: 0; }
  .event-span.span-full { border-radius: 4px; }

  /* ── Event detail modal ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(26, 26, 46, 0.5);
    backdrop-filter: blur(4px);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }
  .modal-overlay.active {
    opacity: 1;
    pointer-events: all;
  }
  .modal-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: 0 24px 64px rgba(0,0,0,0.18);
    max-width: 420px;
    width: 100%;
    padding: 0;
    overflow: hidden;
    transform: translateY(24px) scale(0.96);
    transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .modal-overlay.active .modal-card {
    transform: translateY(0) scale(1);
  }
  .modal-header {
    padding: 24px 24px 16px;
    position: relative;
  }
  .modal-header .modal-color-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
  }
  .modal-close {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 32px;
    height: 32px;
    border-radius: 10px;
    border: none;
    background: var(--bg);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-secondary);
    transition: all 0.15s;
  }
  .modal-close:hover { background: #eee; color: var(--text); }
  .modal-title {
    font-size: 17px;
    font-weight: 700;
    line-height: 1.45;
    padding-right: 40px;
    word-break: keep-all;
    overflow-wrap: break-word;
  }
  .modal-body {
    padding: 0 24px 24px;
  }
  .modal-info {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 12px;
  }
  .modal-info svg {
    flex-shrink: 0;
    margin-top: 2px;
    opacity: 0.5;
  }
  .modal-info-text {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
    line-height: 1.5;
  }
  .modal-info-text strong {
    color: var(--text);
    font-weight: 600;
  }
  .modal-duration {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 6px;
    margin-top: 4px;
  }

  /* ── Footer ── */
  .footer {
    text-align: center;
    padding: 24px 20px 40px;
    font-size: 12px;
    color: var(--text-secondary);
    opacity: 0.6;
  }
  .footer a {
    color: var(--accent);
    text-decoration: none;
  }

  /* ── Desktop tweaks ── */
  @media (min-width: 768px) {
    .hero { padding: 60px 40px 72px }
    .hero h1 { font-size: 36px }
    .hero p { font-size: 16px }
    .stats { gap: 16px }
    .stat-chip { padding: 18px 12px }
    .stat-chip .num { font-size: 26px }
    :root { --cell-h: 92px; --bar-h: 22px; }
    .calendar-day .day-number { font-size: 14px; }
    .event-span { font-size: 11px; }
    .month-nav-title { font-size: 24px; min-width: 160px; }
  }

  /* ── Mobile compact ── */
  @media (max-width: 480px) {
    :root { --cell-h: 62px; --bar-h: 16px; --day-num-h: 20px; }
    .calendar-day .day-number { font-size: 11px; padding: 2px 4px 0; }
    .event-span { font-size: 8px; padding: 0 3px; }
    .calendar-weekday { font-size: 11px; padding: 10px 2px; }
    .month-nav-title { font-size: 18px; min-width: 120px; }
    .modal-card { border-radius: 14px; }
    .modal-header { padding: 20px 20px 12px; }
    .modal-body { padding: 0 20px 20px; }
    .modal-title { font-size: 15px; }
  }

  /* ── Animation ── */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(16px) }
    to   { opacity: 1; transform: translateY(0) }
  }
</style>
</head>
<body>

<!-- Hero -->
<section class="hero">
  <div class="hero-badge">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    2026 시즌
  </div>
  <h1>민속씨름 대회 일정</h1>
  <p>2026년 대한씨름협회 공식 대회 일정을 한눈에 확인하세요</p>
</section>

<!-- Stats -->
<div class="stats">
  <div class="stat-chip">
    <span class="num">8</span>
    <span class="label">총 대회</span>
  </div>
  <div class="stat-chip">
    <span class="num">7</span>
    <span class="label">개최 지역</span>
  </div>
  <div class="stat-chip">
    <span class="num">2~12</span>
    <span class="label">월</span>
  </div>
</div>

<!-- Month navigation -->
<div class="month-nav-bar">
  <button class="month-nav-btn" id="prevMonth" aria-label="이전 달">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <div class="month-nav-title" id="monthTitle"></div>
  <button class="month-nav-btn" id="nextMonth" aria-label="다음 달">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
  </button>
</div>

<!-- Quick month pills -->
<div class="month-pills" id="monthPills"></div>

<!-- Calendar -->
<div class="calendar-container">
  <div class="calendar-grid" id="calendarGrid"></div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card">
    <div class="modal-header">
      <div class="modal-color-bar" id="modalColorBar"></div>
      <button class="modal-close" id="modalClose" aria-label="닫기">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <div class="modal-title" id="modalTitle"></div>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<footer class="footer">
  <p>출처: <a href="https://kpso.co.kr/ksa/Schedule/YearSchedule" target="_blank" rel="noopener">대한씨름협회</a> (kpso.co.kr)</p>
</footer>

<script>
(function() {
  'use strict';

  var events = [
    { title: '위더스제약 2026 태안설날장사씨름대회', startMonth: 2, startDay: 12, endMonth: 2, endDay: 18, location: '충남 태안군', venue: '태안종합실내체육관', days: 7 },
    { title: '위더스제약 2026 민속씨름 단양온달장사씨름대회', startMonth: 3, startDay: 22, endMonth: 3, endDay: 28, location: '충북 단양군', venue: '단양체육관 동관', days: 7 },
    { title: '위더스제약 2026 민속씨름 평창오대산천장사씨름대회', startMonth: 5, startDay: 8, endMonth: 5, endDay: 14, location: '강원 평창군', venue: '진부생활체육관', days: 7 },
    { title: '위더스제약 2026 보은단오장사씨름대회 / 15회 씨름의 날', startMonth: 6, startDay: 8, endMonth: 6, endDay: 14, location: '충북 보은군', venue: '보은국민체육센터', days: 7 },
    { title: '위더스제약 2026 민속씨름 문경오미자장사씨름대회', startMonth: 8, startDay: 3, endMonth: 8, endDay: 8, location: '경북 문경시', venue: '문경실내체육관', days: 6 },
    { title: '위더스제약 2026 괴산추석장사씨름대회', startMonth: 10, startDay: 5, endMonth: 10, endDay: 11, location: '충북 괴산군', venue: '괴산문화체육센터', days: 7 },
    { title: '위더스제약 2026 민속씨름 안산김홍도장사씨름대회', startMonth: 10, startDay: 31, endMonth: 11, endDay: 6, location: '경기 안산시', venue: '와동체육관', days: 7 },
    { title: '위더스제약 2026 천하장사씨름대축제', startMonth: 11, startDay: 30, endMonth: 12, endDay: 6, location: '전남 영암군', venue: '영암체육관', days: 7 }
  ];

  var YEAR = 2026;
  var MONTH_NAMES = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  var WEEKDAYS = ['일','월','화','수','목','금','토'];

  var monthColors = {
    1:  { bg: '#e8f5e9', accent: '#2e7d32', badge: '#43a047' },
    2:  { bg: '#e3f2fd', accent: '#1565c0', badge: '#1e88e5' },
    3:  { bg: '#fce4ec', accent: '#c62828', badge: '#e53935' },
    4:  { bg: '#fff3e0', accent: '#e65100', badge: '#fb8c00' },
    5:  { bg: '#e8eaf6', accent: '#283593', badge: '#3f51b5' },
    6:  { bg: '#e0f7fa', accent: '#00695c', badge: '#00897b' },
    7:  { bg: '#fbe9e7', accent: '#bf360c', badge: '#f4511e' },
    8:  { bg: '#f3e5f5', accent: '#6a1b9a', badge: '#8e24aa' },
    9:  { bg: '#e8f5e9', accent: '#2e7d32', badge: '#43a047' },
    10: { bg: '#fff8e1', accent: '#f57f17', badge: '#fbc02d' },
    11: { bg: '#e3f2fd', accent: '#0d47a1', badge: '#1976d2' },
    12: { bg: '#efebe9', accent: '#4e342e', badge: '#6d4c41' }
  };

  var currentMonth = 1;

  function monthHasEvents(m) {
    var month1 = m + 1;
    return events.some(function(e) {
      return (e.startMonth === month1 || e.endMonth === month1) ||
             (e.startMonth < month1 && e.endMonth > month1);
    });
  }

  function getEventsForMonth(m) {
    var month1 = m + 1;
    return events.filter(function(e) {
      return (e.startMonth === month1 || e.endMonth === month1) ||
             (e.startMonth < month1 && e.endMonth > month1);
    });
  }

  function daysInMonth(year, month0) {
    return new Date(year, month0 + 1, 0).getDate();
  }

  function firstDayOfMonth(year, month0) {
    return new Date(year, month0, 1).getDay();
  }

  function formatDateRange(e) {
    return e.startMonth + '월 ' + e.startDay + '일 ~ ' + e.endMonth + '월 ' + e.endDay + '일';
  }

  function shortName(title) {
    var m = title.match(/2026\s*(?:민속씨름\s*)?(.+)/);
    return m ? m[1] : title;
  }

  function renderPills() {
    var container = document.getElementById('monthPills');
    var html = '';
    for (var i = 0; i < 12; i++) {
      var cls = 'month-pill';
      if (monthHasEvents(i)) cls += ' has-event';
      if (i === currentMonth) cls += ' active';
      html += '<button class="' + cls + '" data-month="' + i + '">' + MONTH_NAMES[i] + '</button>';
    }
    container.innerHTML = html;
    container.querySelectorAll('.month-pill').forEach(function(btn) {
      btn.addEventListener('click', function() {
        currentMonth = parseInt(this.dataset.month);
        render();
      });
    });
  }

  function renderCalendar() {
    var grid = document.getElementById('calendarGrid');
    var month0 = currentMonth;
    var month1 = month0 + 1;
    var totalDays = daysInMonth(YEAR, month0);
    var startDow = firstDayOfMonth(YEAR, month0);

    var today = new Date();
    var todayDay = (today.getFullYear() === YEAR && today.getMonth() === month0) ? today.getDate() : -1;

    var monthEvts = getEventsForMonth(month0);

    // For each event, compute its day range within this month
    var evtRanges = [];
    monthEvts.forEach(function(e, idx) {
      var ds, de;
      if (e.startMonth === month1 && e.endMonth === month1) { ds = e.startDay; de = e.endDay; }
      else if (e.startMonth === month1 && e.endMonth > month1) { ds = e.startDay; de = totalDays; }
      else if (e.startMonth < month1 && e.endMonth === month1) { ds = 1; de = e.endDay; }
      else { ds = 1; de = totalDays; }
      evtRanges.push({ event: e, dayStart: ds, dayEnd: de, idx: idx });
    });

    // Build day-to-events map for click detection
    var dayEventsMap = {};
    evtRanges.forEach(function(r) {
      for (var d = r.dayStart; d <= r.dayEnd; d++) {
        if (!dayEventsMap[d]) dayEventsMap[d] = [];
        dayEventsMap[d].push(r.event);
      }
    });

    // Build weeks: array of arrays, each inner array = 7 cells
    var weeks = [];
    var cells = [];

    // Leading empties
    for (var i = 0; i < startDow; i++) cells.push(null);
    for (var d = 1; d <= totalDays; d++) cells.push(d);
    // Trailing empties
    while (cells.length % 7 !== 0) cells.push(null);

    for (var i = 0; i < cells.length; i += 7) {
      weeks.push(cells.slice(i, i + 7));
    }

    // For each event range, split into per-week segments
    // Each segment: { event, colStart (0-6), colEnd (0-6), weekIdx, isStart, isEnd }
    var weekSegments = weeks.map(function() { return []; });

    evtRanges.forEach(function(r) {
      for (var wi = 0; wi < weeks.length; wi++) {
        var week = weeks[wi];
        var weekDayStart = null, weekDayEnd = null;
        var colStart = -1, colEnd = -1;

        for (var ci = 0; ci < 7; ci++) {
          var dayVal = week[ci];
          if (dayVal !== null && dayVal >= r.dayStart && dayVal <= r.dayEnd) {
            if (colStart === -1) { colStart = ci; weekDayStart = dayVal; }
            colEnd = ci;
            weekDayEnd = dayVal;
          }
        }

        if (colStart !== -1) {
          var isRangeStart = (weekDayStart === r.dayStart && r.event.startMonth === month1);
          var isRangeEnd = (weekDayEnd === r.dayEnd && r.event.endMonth === month1);
          // For cross-month events continuing from previous month
          var isVeryStart = (weekDayStart === r.dayStart);
          var isVeryEnd = (weekDayEnd === r.dayEnd);

          weekSegments[wi].push({
            event: r.event,
            colStart: colStart,
            colEnd: colEnd,
            isStart: isVeryStart,
            isEnd: isVeryEnd
          });
        }
      }
    });

    // Render HTML
    var html = '';

    // Weekday headers
    html += '<div class="calendar-weekdays">';
    WEEKDAYS.forEach(function(w, i) {
      var cls = 'calendar-weekday';
      if (i === 0) cls += ' sun';
      if (i === 6) cls += ' sat';
      html += '<div class="' + cls + '">' + w + '</div>';
    });
    html += '</div>';

    // Week rows
    weeks.forEach(function(week, wi) {
      html += '<div class="week-row">';

      // Day cells
      week.forEach(function(dayVal, ci) {
        var cls = 'calendar-day';
        if (dayVal === null) cls += ' empty';
        if (dayVal === todayDay) cls += ' today';
        if (ci === 0) cls += ' sun';
        if (ci === 6) cls += ' sat';
        if (dayVal !== null && dayEventsMap[dayVal]) cls += ' has-event';

        html += '<div class="' + cls + '"';
        if (dayVal !== null) html += ' data-day="' + dayVal + '"';
        html += '>';

        if (dayVal !== null) {
          if (dayVal === todayDay) {
            html += '<span class="day-number"><span>' + dayVal + '</span></span>';
          } else {
            html += '<span class="day-number">' + dayVal + '</span>';
          }
        }

        html += '</div>';
      });

      // Event span bars (absolute-positioned over the week row)
      var segs = weekSegments[wi];
      // Assign vertical slots to avoid overlaps
      var slotMap = []; // array of arrays, each sub-array = one slot's occupied columns
      segs.forEach(function(seg) {
        var slot = -1;
        for (var s = 0; s < slotMap.length; s++) {
          var conflict = false;
          for (var c = seg.colStart; c <= seg.colEnd; c++) {
            if (slotMap[s][c]) { conflict = true; break; }
          }
          if (!conflict) { slot = s; break; }
        }
        if (slot === -1) { slot = slotMap.length; slotMap.push({}); }
        for (var c = seg.colStart; c <= seg.colEnd; c++) slotMap[slot][c] = true;
        seg.slot = slot;
      });

      segs.forEach(function(seg) {
        var evColor = monthColors[seg.event.startMonth];
        var leftPct = (seg.colStart / 7 * 100).toFixed(4);
        var widthPct = ((seg.colEnd - seg.colStart + 1) / 7 * 100).toFixed(4);
        var topPx = 'calc(var(--day-num-h) + ' + seg.slot + ' * (var(--bar-h) + var(--bar-gap)))';

        var shapeCls = 'event-span';
        if (seg.isStart && seg.isEnd) shapeCls += ' span-full';
        else if (seg.isStart) shapeCls += ' span-start';
        else if (seg.isEnd) shapeCls += ' span-end';
        else shapeCls += ' span-mid';

        var label = seg.isStart ? shortName(seg.event.title) : '';

        html += '<div class="' + shapeCls + '" ' +
          'style="left:' + leftPct + '%;width:' + widthPct + '%;top:' + topPx + ';' +
          'background:' + evColor.bg + ';color:' + evColor.accent + ';" ' +
          'data-event-title="' + seg.event.title.replace(/"/g, '&quot;') + '" ' +
          'title="' + seg.event.title + '">' +
          label +
          '</div>';
      });

      html += '</div>';
    });

    grid.innerHTML = html;
    grid.style.animation = 'none';
    grid.offsetHeight;
    grid.style.animation = 'fadeInUp 0.35s ease both';

    // Click listeners on event spans
    grid.querySelectorAll('.event-span').forEach(function(bar) {
      bar.addEventListener('click', function(ev) {
        ev.stopPropagation();
        var title = this.dataset.eventTitle;
        var event = events.find(function(e) { return e.title === title; });
        if (event) openModal(event);
      });
    });

    // Click listeners on day cells
    grid.querySelectorAll('.calendar-day.has-event').forEach(function(cell) {
      cell.addEventListener('click', function() {
        var dayNum = parseInt(this.dataset.day);
        if (dayEventsMap[dayNum] && dayEventsMap[dayNum].length > 0) {
          openModal(dayEventsMap[dayNum][0]);
        }
      });
    });
  }

  function openModal(event) {
    var overlay = document.getElementById('modalOverlay');
    var evColor = monthColors[event.startMonth];

    document.getElementById('modalColorBar').style.background = evColor.badge;
    document.getElementById('modalTitle').textContent = event.title;

    var bodyHTML = '';

    bodyHTML += '<div class="modal-info">' +
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>' +
      '<div class="modal-info-text"><strong>' + formatDateRange(event) + '</strong>' +
      '<br><span class="modal-duration" style="background:' + evColor.bg + ';color:' + evColor.accent + ';">' + event.days + '일간</span></div></div>';

    bodyHTML += '<div class="modal-info">' +
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>' +
      '<div class="modal-info-text"><strong>' + event.location + '</strong></div></div>';

    bodyHTML += '<div class="modal-info">' +
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>' +
      '<div class="modal-info-text"><strong>' + event.venue + '</strong></div></div>';

    document.getElementById('modalBody').innerHTML = bodyHTML;
    overlay.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
    document.body.style.overflow = '';
  }

  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeModal();
  });

  document.getElementById('prevMonth').addEventListener('click', function() {
    currentMonth = (currentMonth - 1 + 12) % 12;
    render();
  });
  document.getElementById('nextMonth').addEventListener('click', function() {
    currentMonth = (currentMonth + 1) % 12;
    render();
  });

  (function() {
    var startX = 0;
    var gridEl = document.getElementById('calendarGrid');
    gridEl.addEventListener('touchstart', function(e) {
      startX = e.touches[0].clientX;
    }, { passive: true });
    gridEl.addEventListener('touchend', function(e) {
      var diffX = e.changedTouches[0].clientX - startX;
      if (Math.abs(diffX) > 60) {
        currentMonth = diffX > 0 ? (currentMonth - 1 + 12) % 12 : (currentMonth + 1) % 12;
        render();
      }
    }, { passive: true });
  })();

  document.addEventListener('keydown', function(e) {
    if (document.getElementById('modalOverlay').classList.contains('active')) return;
    if (e.key === 'ArrowLeft') { currentMonth = (currentMonth - 1 + 12) % 12; render(); }
    else if (e.key === 'ArrowRight') { currentMonth = (currentMonth + 1) % 12; render(); }
  });

  function render() {
    document.getElementById('monthTitle').textContent = YEAR + '년 ' + MONTH_NAMES[currentMonth];
    renderPills();
    renderCalendar();
  }

  var now = new Date();
  currentMonth = (now.getFullYear() === YEAR) ? now.getMonth() : 1;
  render();
})();
</script>

</body>
</html>
